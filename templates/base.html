{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link
        rel="stylesheet"
        href="{% static 'homepage/css/style.css' %}"
    >
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="container">
        <img
            src="{% static 'homepage/img/logo.png' %}"
            alt="Культурный досуг"
            class="leisure-logo"
        >
        {% include "includes/navigation.html" %}
    </header>

    <main class="container flex-grow-1">
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container mt-4 mb-3">
        <p class="text-muted">
            © <span id="current-year"></span>
            {{ site_name }} · мероприятий в каталоге: {{ events_count }}
        </p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
