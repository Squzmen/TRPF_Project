<article class="card event-card mb-3">
    <div class="card-body">
        <h2 class="card-title h4">
            {{ event.name|default:"Без названия" }}
        </h2>

        <p class="card-text">
            <span class="badge bg-info text-dark">{{ event.category }}</span>
            {{ event.event_date|date:"d.m.Y" }}
        </p>

        <p class="card-text">
            Билет: {{ event.ticket_price|floatformat:2 }} руб.
            Возраст: от {{ event.age_limit }} лет.
        </p>

        <p class="card-text">
            {% if seats_left > 0 %}
                <span class="badge bg-success">
                    свободно мест: {{ seats_left }}
                </span>
            {% else %}
                <span class="badge bg-danger">мест нет</span>
            {% endif %}
        </p>

        <a
            href="{{ event.get_absolute_url }}"
            class="btn btn-primary"
        >
            Подробнее
        </a>
    </div>
</article>
